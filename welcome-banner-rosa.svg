<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4E1;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="20" ry="20" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="70" cy="50" r="25" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="730" cy="150" r="20" fill="#FF69B4" opacity="0.5"/>
  <circle cx="150" cy="170" r="15" fill="#FFC0CB" opacity="0.7"/>
  <circle cx="650" cy="40" r="18" fill="#FFB6C1" opacity="0.6"/>
  
  <!-- Decorative hearts -->
  <g transform="translate(100, 30)" fill="#FF69B4" opacity="0.4">
    <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5 C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" transform="scale(0.8)"/>
  </g>
  
  <g transform="translate(680, 120)" fill="#FF69B4" opacity="0.4">
    <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5 C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3 C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" transform="scale(0.6)"/>
  </g>
  
  <!-- Stars -->
  <g fill="#FF69B4" opacity="0.6">
    <polygon points="200,60 202,66 208,66 203,70 205,76 200,72 195,76 197,70 192,66 198,66" transform="scale(0.8)"/>
    <polygon points="600,30 602,36 608,36 603,40 605,46 600,42 595,46 597,40 592,36 598,36" transform="scale(0.6)"/>
    <polygon points="750,80 752,86 758,86 753,90 755,96 750,92 745,96 747,90 742,86 748,86" transform="scale(0.7)"/>
  </g>
  
  <!-- Welcome Text -->
  <text x="400" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#pinkGradient)" filter="url(#glow)">
    Welcome! ✨
  </text>
</svg>